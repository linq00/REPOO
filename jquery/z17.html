$("#licz").on("click", function() {
    let waga = $("#waga").val().trim();
    let wzrost = $("#wzrost").val().trim();

    if (waga === "" || wzrost === "") {
        $("#bmi").css("color", "red").text("Uzupełnij oba pola!");
    }
    else if (isNaN(waga) || isNaN(wzrost)) {
        $("#bmi").css("color", "red").text("Wprowadź liczby!");
    }
    else if (Number(waga) < 20 || Number(waga) > 300) {
        $("#bmi").css("color", "red").text("Waga musi być w zakresie 20–300 kg!");
    }
    else if (Number(wzrost) < 100 || Number(wzrost) > 250) {
        $("#bmi").css("color", "red").text("Wzrost musi być w zakresie 100–250 cm!");
    }
    else {
        let wagaNum = Number(waga);
        let wzrostNum = Number(wzrost);
        let wzrostMetry = wzrostNum / 100;

        let bmi = (wagaNum / Math.pow(wzrostMetry, 2)).toFixed(1);

        $("#bmi").css("color", "green").text("Twoje BMI: " + bmi);
    }
});
